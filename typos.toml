[files]
extend-exclude = ["pnpm-lock.yaml", "dist/", "rust/fixtures/"]

[default.extend-words]
# ink-gradient gradient name — false positive for "crystal"
cristal = "cristal"
# custom day-based billing cycles ("3d" = every N days) — false positive for "And"
Nd = "Nd"
# Rust crate name (flate2 crate, tokenizes as "flate"+"2", not the word "flate")
flate = "flate"
# shorthand identifiers for input/output tokens in usage.rs
ot = "ot"
