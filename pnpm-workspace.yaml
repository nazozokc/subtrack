packages:
  - "packages/subtrack"
  - "packages/subtrack-*"
  - "docs"

# Only esbuild is permitted to run install scripts.
# All other dependencies (including transitive) are blocked from running
# postinstall/preinstall scripts as a supply chain security measure.
allowBuilds:
  esbuild: true

# Force brace-expansion, js-yaml, nanoid, postcss to patched versions to
# pass pnpm audit --audit-level=high (via secretlint / vitepress / vitest)
#
# Force vite, esbuild, vue and source-map-js to patched versions
# (via vitepress)
overrides:
  brace-expansion: ">=5.0.9"
  js-yaml: ">=5.2.2"
  nanoid: ">=3.3.18"
  postcss: ">=8.5.18"
  vite: ">=6.4.3 <8"
  esbuild: ">=0.24.3"
  vue: ">=3.5.42"
  source-map-js: ">=1.2.2"
