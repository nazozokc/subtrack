name: app-ci

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/subtrack/**"
      - ".github/workflows/**"
      - "pnpm-workspace.yaml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/subtrack/**"
      - ".github/workflows/**"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  compatibility:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 23, 24]
        include:
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - name: Verify CLI runs (built binary)
        if: runner.os != 'Windows'
        working-directory: ./apps/subtrack
        run: node dist/index.mjs --help

      - name: Spell check
        if: runner.os == 'Linux' && matrix.node-version == 22
        uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2
        with:
          files: apps/subtrack/
          config: typos.toml

      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: pnpm audit --audit-level=high
