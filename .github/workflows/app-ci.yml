name: app-ci

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "packages/subtrack/**"
      - "rust/**"
      - "rust-toolchain.toml"
      - "scripts/**"
      - ".github/workflows/**"
      - "pnpm-workspace.yaml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "packages/subtrack/**"
      - "rust/**"
      - "rust-toolchain.toml"
      - "scripts/**"
      - ".github/workflows/**"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  compatibility:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24, 26]
        include:
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - name: Spell check
        if: runner.os == 'Linux' && matrix.node-version == 22
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          files: packages/subtrack/ rust/ docs/
          config: typos.toml

      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: pnpm audit --audit-level=high
