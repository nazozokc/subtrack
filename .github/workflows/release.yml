name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/app-ci.yml

  # Builds one native binary per platform/arch and stages it into the matching
  # platform package (packages/subtrack-<os>-<arch>/bin/) before uploading it as
  # a tarball artifact. Linux binaries are static musl so they run on any glibc
  # or musl distro; the Windows and macOS x64 legs cross-compile from the arm64
  # hosted runners using rustup's prebuilt targets.
  build-native-packages:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
          - os: macos-14
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-14
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
          - os: windows-latest
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: win32
            arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl toolchain
        if: matrix.platform == 'linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add Rust target
        shell: bash
        # Read the channel from rust-toolchain.toml (repo root) so the target
        # is added to the same toolchain the build resolves (single source of
        # truth, rustup auto-installs it if missing).
        run: |
          toolchain="$(awk -F'"' '/^channel/{print $2; exit}' rust-toolchain.toml)"
          echo "Using toolchain $toolchain from rust-toolchain.toml"
          rustup toolchain install "$toolchain"
          rustup target add --toolchain "$toolchain" "${{ matrix.target }}"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
          else
            version="$(node -p "require('./packages/subtrack/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building subtrack $version for ${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Build (linux)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          SUBTRACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          triple="${{ matrix.target }}"
          export "CC_${triple//-/_}=musl-gcc"
          export "AR_${triple//-/_}=ar"
          export "CARGO_TARGET_${triple//-/_}_LINKER=musl-gcc"
          cargo build --release --locked \
            --manifest-path rust/Cargo.toml \
            --bin subtrack \
            --target "$triple"

      - name: Build (macOS / Windows)
        if: matrix.platform != 'linux'
        shell: bash
        env:
          SUBTRACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --release --locked \
            --manifest-path rust/Cargo.toml \
            --bin subtrack \
            --target "${{ matrix.target }}"

      - name: Verify version
        shell: bash
        run: |
          bin="rust/target/${{ matrix.target }}/release/subtrack"
          if [ "${{ matrix.platform }}" = "win32" ]; then bin="$bin.exe"; fi
          version="${{ steps.version.outputs.version }}"
          if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
            # x64 Windows runners cannot execute ARM64 binaries, so verify the
            # baked-in version literal instead of running the binary.
            grep -qaF -- "$version" "$bin"
            echo "verified version literal $version in $bin"
          else
            reported="$("$bin" --version)"
            echo "$bin reports $reported"
            test "$reported" = "$version"
          fi

      - name: Verify Linux binary is static
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          bin="rust/target/${{ matrix.target }}/release/subtrack"
          file "$bin"
          ldd "$bin" 2>&1 | tee "$RUNNER_TEMP/ldd.txt" || true
          grep -Eiq 'not a dynamic executable|statically linked' "$RUNNER_TEMP/ldd.txt"

      - name: Stage native package
        shell: bash
        run: |
          pkg="packages/subtrack-${{ matrix.platform }}-${{ matrix.arch }}"
          bin="rust/target/${{ matrix.target }}/release/subtrack"
          mkdir -p "$pkg/bin"
          if [ "${{ matrix.platform }}" = "win32" ]; then
            cp "$bin.exe" "$pkg/bin/subtrack.exe"
          else
            cp "$bin" "$pkg/bin/subtrack"
            chmod 755 "$pkg/bin/subtrack"
          fi
          tar -cf "subtrack-native-${{ matrix.platform }}-${{ matrix.arch }}.tar" "$pkg/bin"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subtrack-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: subtrack-native-${{ matrix.platform }}-${{ matrix.arch }}.tar
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build-native-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: subtrack-native-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true

      - name: Restore native package binaries
        run: |
          for archive in "$RUNNER_TEMP"/native-packages/*.tar; do
            tar -xf "$archive"
          done

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./packages/subtrack/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Set package versions
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - run: pnpm install --frozen-lockfile

      - name: Verify native packages are staged
        run: |
          set -eu
          for dir in packages/subtrack-*/; do
            test -n "$(ls -A "$dir/bin")" || { echo "::error::$dir/bin is empty"; exit 1; }
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          artifact-name: subtrack-sbom-${{ steps.version.outputs.version || 'dev' }}
          format: spdx-json

      - name: Dry run publish
        if: github.event_name == 'release' || inputs.dry-run == true
        run: |
          pnpm -r --filter './packages/subtrack*' publish \
            --no-git-checks --provenance --access public --dry-run

      - name: Publish to npm
        if: github.event_name == 'release' || inputs.dry-run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm -r --filter './packages/subtrack*' publish \
            --no-git-checks --provenance --access public
