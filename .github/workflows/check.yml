name: check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is up to date
        run: pnpm install --lockfile-only && git diff --exit-code pnpm-lock.yaml

      - name: Validate lockfile structure
        working-directory: ./apps/subtrack
        run: pnpm lint:lockfile

      - name: Check dependency tree is deduplicated
        working-directory: ./apps/subtrack
        run: pnpm lint:dedupe

      - name: Type check
        working-directory: ./apps/subtrack
        run: pnpm lint:types

      - run: pnpm build

      - run: pnpm test

      - name: Audit dependencies (pnpm)
        run: pnpm audit --audit-level=high

      - name: Verify npm package provenance
        run: |
          npm audit --audit-level=high --verify-provenance 2>/dev/null || \
            echo "⚠ npm provenance verification not supported in this environment (expected on Node >=22 with npm <12)"

      - name: Scan for secrets and credentials
        working-directory: ./apps/subtrack
        run: pnpm lint:secrets

      - name: Detect Trojan Source (Unicode control characters)
        run: |
          if grep -rnP '[\u202A\u202B\u202C\u202D\u202E\u2066\u2067\u2068\u2069\u200B\u200C\u200D\uFEFF]' \
            --include='*.ts' --include='*.json' --include='*.yaml' --include='*.yml' \
            --include='*.md' --include='*.toml' \
            apps/subtrack/ docs/ .github/; then
            echo "::error::Bidirectional / zero-width Unicode control characters detected (possible Trojan Source attack)"
            exit 1
          fi
          echo "No Trojan Source characters detected"
