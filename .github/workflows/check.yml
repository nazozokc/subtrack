name: check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is up to date
        run: pnpm install --lockfile-only && git diff --exit-code pnpm-lock.yaml

      - name: Validate lockfile structure
        working-directory: ./packages/subtrack
        run: pnpm lint:lockfile

      - name: Check dependency tree is deduplicated
        working-directory: ./packages/subtrack
        run: pnpm lint:dedupe

      - run: pnpm build

      - run: pnpm test

      # Rust gates. The root rust-toolchain.toml pins the toolchain
      # (clippy + rustfmt included), installed by rustup on first use.
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Lint Rust (clippy, deny warnings)
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust (unit + CLI smoke suite)
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Audit dependencies (pnpm)
        run: pnpm audit --audit-level=high

      - name: Verify npm package provenance
        run: |
          npm audit --audit-level=high --verify-provenance 2>/dev/null || \
            echo "⚠ npm provenance verification not supported in this environment (expected on Node >=22 with npm <12)"

      - name: Detect Trojan Source (Unicode control characters)
        run: |
          if grep -rnP '[\u202A\u202B\u202C\u202D\u202E\u2066\u2067\u2068\u2069\u200B\u200C\u200D\uFEFF]' \
            --include='*.ts' --include='*.rs' --include='*.mjs' --include='*.js' \
            --include='*.json' --include='*.yaml' --include='*.yml' \
            --include='*.md' --include='*.toml' --include='*.nix' \
            packages/subtrack/ rust/ scripts/ docs/ .github/; then
            echo "::error::Bidirectional / zero-width Unicode control characters detected (possible Trojan Source attack)"
            exit 1
          fi
          echo "No Trojan Source characters detected"
