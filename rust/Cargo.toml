[workspace]
resolver = "3"
members = ["crates/subtrack", "crates/golden"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "10.0.0"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
scrypt = "0.11"
sha2 = "0.10"
hex = "0.4"
