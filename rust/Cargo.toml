[workspace]
resolver = "3"
members = ["subtrack"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.package]
edition = "2024"
license = "MIT"
version = "12.0.0"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.11"
scrypt = "0.11"
sha2 = "0.11"
hex = "0.4"
# OS CSPRNG for key/nonce generation (replaces direct /dev/urandom reads,
# which do not exist on Windows).
getrandom = "0.4"
